<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <title>Tmux Panel</title>
  <style>html { -webkit-text-size-adjust: 100%; }</style>
  <link rel="stylesheet" href="https://unpkg.com/@xterm/xterm@5/css/xterm.css">
  <script src="https://unpkg.com/@xterm/xterm@5/lib/xterm.js"></script>
  <script src="https://unpkg.com/@xterm/addon-fit@0/lib/addon-fit.js"></script>
  <script src="https://unpkg.com/@xterm/addon-web-links@0/lib/addon-web-links.js"></script>
  <script src="https://unpkg.com/@xterm/addon-webgl@0/lib/addon-webgl.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <span id="status-dot" class="topbar-dot"></span>
      <button id="session-switcher" class="topbar-session-btn">
        <span id="session-name">—</span>
        <span class="topbar-caret">&#9662;</span>
      </button>
      <span id="status-info"></span>
      <button id="btn-add-window" class="btn topbar-action-btn" title="New Window">&#43;</button>
      <button id="btn-more" class="btn topbar-action-btn" title="More">&#9881;</button>
    </header>
    <div id="session-dropdown" class="session-dropdown" style="display:none;"></div>
    <div id="main-layout">
      <aside id="sidebar"></aside>
      <main id="content"></main>
    </div>
  </div>
  <script src="/js/auth.js?v=2"></script>
  <script src="/js/theme.js?v=2"></script>
  <script src="/js/panes.js?v=2"></script>
  <script src="/js/sessions.js?v=2"></script>
  <script src="/js/windows.js?v=2"></script>
  <script src="/js/terminal.js?v=2"></script>
  <script src="/js/app.js?v=2"></script>
</body>
</html>
