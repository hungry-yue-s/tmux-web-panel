<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Tmux Panel</title>
  <style>html { -webkit-text-size-adjust: 100%; }</style>
  <link rel="stylesheet" href="https://unpkg.com/@xterm/xterm@5/css/xterm.css">
  <script src="https://unpkg.com/@xterm/xterm@5/lib/xterm.js"></script>
  <script src="https://unpkg.com/@xterm/addon-fit@0/lib/addon-fit.js"></script>
  <script src="https://unpkg.com/@xterm/addon-web-links@0/lib/addon-web-links.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <span class="logo">&hexmark; Tmux Panel</span>
      <span id="status-info"></span>
      <button id="btn-new-session" class="btn btn-primary">+ New Session</button>
    </header>
    <div id="main-layout">
      <aside id="sidebar"></aside>
      <main id="content"></main>
    </div>
    <nav id="tab-bar">
      <button class="tab active" data-tab="sessions">&#9776;<span>Sessions</span></button>
      <button class="tab" data-tab="windows">&#11034;<span>Windows</span></button>
      <button class="tab" data-tab="terminal">&#9635;<span>Terminal</span></button>
      <button class="tab" data-tab="more">&#9881;<span>More</span></button>
    </nav>
  </div>
  <script src="/js/app.js"></script>
</body>
</html>
