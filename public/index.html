<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <title>Tmux Panel</title>
  <style>html { -webkit-text-size-adjust: 100%; }</style>
  <link rel="stylesheet" href="https://unpkg.com/@xterm/xterm@6.0.0/css/xterm.css">
  <link rel="preload" href="/fonts/TmuxPanelMono-Regular.woff2?v=1" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/TmuxPanelMono-Bold.woff2?v=1" as="font" type="font/woff2" crossorigin>
  <script src="https://unpkg.com/@xterm/xterm@6.0.0/lib/xterm.js"></script>
  <script src="https://unpkg.com/@xterm/addon-fit@0.11.0/lib/addon-fit.js"></script>
  <script src="https://unpkg.com/@xterm/addon-webgl@0.19.0/lib/addon-webgl.js"></script>
  <link rel="stylesheet" href="/css/style.css?v=17">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <span id="status-dot" class="topbar-dot"></span>
      <button id="session-switcher" class="topbar-session-btn">
        <span id="session-name">—</span>
        <span class="topbar-caret">&#9662;</span>
      </button>
      <span id="status-info"></span>
      <button id="btn-add-window" class="btn topbar-action-btn" title="New Window"><svg class="app-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="btn topbar-action-btn notification-bell" title="Notifications" onclick="NotificationPanel.render(event)"><svg class="app-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg><span class="notification-bell-count" style="display:none">0</span></button>
      <button id="btn-app-fullscreen" class="btn topbar-action-btn app-fullscreen-btn" type="button" data-app-fullscreen title="全屏显示面板" aria-label="全屏显示面板" aria-pressed="false"><svg class="app-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g class="fullscreen-icon-enter"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></g><g class="fullscreen-icon-exit"><path d="M3 8h5V3M21 8h-5V3M3 16h5v5M21 16h-5v5"/></g></svg></button>
      <button id="btn-more" class="btn topbar-action-btn" title="More"><svg class="app-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.09A1.7 1.7 0 0 0 8.94 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.54-1H3v-4h.09A1.7 1.7 0 0 0 4.6 8.94a1.7 1.7 0 0 0-.34-1.88L4.2 7l2.83-2.83.06.06A1.7 1.7 0 0 0 8.97 4.6 1.7 1.7 0 0 0 10 3.06V3h4v.09a1.7 1.7 0 0 0 1.06 1.51 1.7 1.7 0 0 0 1.88-.34L17 4.2 19.83 7l-.06.06a1.7 1.7 0 0 0-.34 1.88A1.7 1.7 0 0 0 20.94 10H21v4h-.09A1.7 1.7 0 0 0 19.4 15Z"/></svg></button>
    </header>
    <div id="session-dropdown" class="session-dropdown" style="display:none;"></div>
    <div id="main-layout">
      <aside id="sidebar"></aside>
      <main id="content"></main>
    </div>
  </div>
  <script src="/js/auth.js?v=2"></script>
  <script src="/js/theme.js?v=4"></script>
  <script src="/js/panes.js?v=2"></script>
  <script src="/js/sessions.js?v=2"></script>
  <script type="module" src="/js/sort-windows.js?v=1"></script>
  <script src="/js/windows.js?v=2"></script>
  <script src="/js/link-detect.js?v=1"></script>
  <script src="/js/file-preview.js?v=29"></script>
  <script src="/js/terminal.js?v=10"></script>
  <script src="/js/notifications.js?v=3"></script>
  <script src="/js/system-stats.js?v=2"></script>
  <script src="/js/perf-utils.js?v=1"></script>
  <script src="/js/perf-panel.js?v=2"></script>
  <script src="/js/fab-scene.js?v=1"></script>
  <script src="/js/fab-heat.js?v=1"></script>
  <script src="/js/fab-migrate.js?v=1"></script>
  <script src="/js/fab-drawer.js?v=1"></script>
  <script src="/js/app-fullscreen.js?v=2"></script>
  <script src="/js/app.js?v=11"></script>
  <script src="/js/command-palette.js?v=2"></script>
  <script src="/js/layout-picker.js?v=2"></script>
</body>
</html>
