<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal</title>
  <link rel="stylesheet" href="/vendor/xterm/xterm.css?v=6.0.0">
  <!-- terminal-font-preload -->
  <link rel="preload" href="/fonts/tpm/tpm-400-core.c21636df8e.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/tpm/tpm-700-core.540225bef8.woff2" as="font" type="font/woff2" crossorigin>
  <!-- /terminal-font-preload -->
  <link rel="stylesheet" href="/css/terminal-fonts.css">
  <script src="/vendor/xterm/xterm.js?v=6.0.0"></script>
  <script src="/vendor/xterm/addon-fit.js?v=0.11.0"></script>
  <script src="/js/theme.js?v=7"></script>
  <script src="/js/terminal-fonts-data.js"></script>
  <script src="/js/terminal-fonts.js"></script>
  <script src="/js/link-detect.js"></script>
  <script src="/js/file-preview.js?v=51"></script>
  <style>
    @font-face {
      font-family: 'Symbols Nerd Font Mono';
      src: url('/fonts/SymbolsNerdFontMono-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    html, body { margin: 0; padding: 0; background: var(--bg-primary, #1a1b26); height: 100%; overflow: hidden; }
    #terminal { width: 100%; height: 100%; }
    html[data-native-transparency] { background: transparent; }
    html[data-native-transparency] body { background: var(--native-window-background); }
    html[data-native-transparency] .xterm-viewport { background: transparent !important; }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var paneId = params.get('pane');

      if (!paneId) {
        document.getElementById('terminal').innerHTML =
          '<div style="padding: 24px; text-align: center; color: #c0caf5; font-family: monospace;">' +
          'No pane ID specified. Use ?pane=ID in the URL.' +
          '</div>';
        return;
      }

      document.title = 'Terminal — ' + paneId;

      var term = new Terminal({
        theme: Theme.getTerminalTheme(),
        // Resolve contrast against each cell background, including TUI colors.
        minimumContrastRatio: 4.5,
        allowTransparency: Theme.supportsTransparency(),
        fontFamily: 'monospace',
        fontSize: 14,
        cursorBlink: true,
      });

      function updateTheme() { term.options.theme = Theme.getTerminalTheme(); }
      document.addEventListener('tmux-theme-change', updateTheme);
      document.addEventListener('tmux-transparency-change', updateTheme);

      var fitAddon = new FitAddon.FitAddon();

      term.loadAddon(fitAddon);
      // Unified link provider (URL + file path) via link-detect.js — the old
      // web-links addon could not merge soft-wrapped rows.
      if (typeof FilePreview !== 'undefined') {
        FilePreview.registerLinkProvider(term, paneId);
      }

      var container = document.getElementById('terminal');
      term.open(container);

      var firstWrite = new Promise(function (resolve) {
        var listener = term.onWriteParsed(function () {
          listener.dispose();
          resolve();
        });
      });
      var FONT_FAMILY = "'Tmux Panel Mono', 'Maple Mono NF CN', 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Symbols Nerd Font Mono', monospace";
      function applyFont() {
        // Toggling forces xterm to measure the cells again.
        term.options.fontFamily = 'monospace';
        term.options.fontFamily = FONT_FAMILY;
        if (typeof term.clearTextureAtlas === 'function') term.clearTextureAtlas();
        fitAddon.fit();
        term.refresh(0, term.rows - 1);
      }
      // Wait briefly for the small core font slice; a slow link starts with the
      // fallback monospace and switches when the core arrives.
      Promise.all([TerminalFonts.coreReady(1500), firstWrite]).then(function (ready) {
        if (ready[0] === false) return;
        applyFont();
        if (ready[0] === null) TerminalFonts.coreReady(0).then(function (loaded) { if (loaded) applyFont(); });
      }).catch(function () { /* keep the working default font */ });

      // The canvas never triggers unicode-range loads: fetch the CJK / icon
      // slices for what is on screen, then rebuild the glyph cache.
      var slicesScan = null;
      function scanSlices() {
        slicesScan = null;
        var buffer = term.buffer.active, regular = '', bold = '', cell;
        for (var y = buffer.viewportY; y < buffer.viewportY + term.rows; y++) {
          var line = buffer.getLine(y);
          if (!line || !/[^\x00-ჿ]/.test(line.translateToString(true))) continue;
          for (var x = 0; x < line.length; x++) {
            cell = line.getCell(x, cell);
            var chars = cell && cell.getChars();
            if (!chars || chars.charCodeAt(0) < 0x1100) continue;
            if (cell.isBold()) bold += chars; else regular += chars;
          }
        }
        Promise.all([TerminalFonts.ensure(regular, 400), TerminalFonts.ensure(bold, 700)]).then(function (loaded) {
          if (!loaded[0] && !loaded[1]) return;
          if (typeof term.clearTextureAtlas === 'function') term.clearTextureAtlas();
          term.refresh(0, term.rows - 1);
        });
      }
      function scheduleSlices() { if (!slicesScan) slicesScan = setTimeout(scanSlices, 120); }
      term.onWriteParsed(scheduleSlices);
      term.onScroll(scheduleSlices);

      if (term.textarea) {
        term.textarea.setAttribute('autocapitalize', 'off');
        term.textarea.setAttribute('autocomplete', 'off');
        term.textarea.setAttribute('autocorrect', 'off');
        term.textarea.setAttribute('spellcheck', 'false');
      }

      setTimeout(function () {
        fitAddon.fit();
      }, 50);

      // WebSocket connection
      var wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      var wsUrl = wsProtocol + '//' + location.host + '/ws/terminal/' + encodeURIComponent(paneId);
      var authToken = null;
      try { authToken = localStorage.getItem('tmux_auth_token'); } catch (_e) {}
      if (authToken) wsUrl += '?token=' + encodeURIComponent(authToken);
      var ws = new WebSocket(wsUrl);

      ws.onopen = function () {
        if (term.cols && term.rows) {
          ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
        }
      };

      function _copyToClipboard(text) {
        try {
          var handlers = window.webkit && window.webkit.messageHandlers;
          var nativeHandler = handlers && handlers.tmuxPanelClipboard;
          if (nativeHandler && typeof nativeHandler.postMessage === 'function') {
            nativeHandler.postMessage({ text: String(text) });
            return;
          }
        } catch (_err) { /* fall through to browser clipboard paths */ }

        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).catch(function () {});
          return;
        }
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px;opacity:0;';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try { document.execCommand('copy'); } catch (_e) { /* ignore */ }
        document.body.removeChild(ta);
      }

      ws.onmessage = function (e) {
        try {
          var msg = JSON.parse(e.data);
          if (msg.type === 'output') {
            term.write(msg.data);
          } else if (msg.type === 'clipboard') {
            _copyToClipboard(msg.data);
          }
        } catch (_err) {
          // Ignore
        }
      };

      ws.onclose = function () {
        term.write('\r\n\x1b[31m[Connection closed]\x1b[0m\r\n');
      };

      term.onData(function (data) {
        if (ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'input', data: data }));
        }
      });

      // Auto-resize. Guard against ResizeObserver re-firing on selection-
      // induced sub-tree layout changes: only send `resize` when cols/rows
      // actually changed, otherwise tmux pushes a full redraw and the
      // in-progress text selection gets cleared mid-drag.
      var _lastCols = 0, _lastRows = 0;
      var resizeObserver = new ResizeObserver(function () {
        fitAddon.fit();
        if (term.cols === _lastCols && term.rows === _lastRows) return;
        _lastCols = term.cols;
        _lastRows = term.rows;
        if (ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
        }
      });
      resizeObserver.observe(container);

      // Cleanup on page unload
      window.addEventListener('beforeunload', function () {
        resizeObserver.disconnect();
        ws.close();
        term.dispose();
      });
    })();
  </script>
</body>
</html>
