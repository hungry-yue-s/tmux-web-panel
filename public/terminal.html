<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal</title>
  <link rel="stylesheet" href="https://unpkg.com/@xterm/xterm@5/css/xterm.css">
  <script src="https://unpkg.com/@xterm/xterm@5/lib/xterm.js"></script>
  <script src="https://unpkg.com/@xterm/addon-fit@0/lib/addon-fit.js"></script>
  <script src="https://unpkg.com/@xterm/addon-web-links@0/lib/addon-web-links.js"></script>
  <style>
    html, body { margin: 0; padding: 0; background: #1a1b26; height: 100%; overflow: hidden; }
    #terminal { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var paneId = params.get('pane');

      if (!paneId) {
        document.getElementById('terminal').innerHTML =
          '<div style="padding: 24px; text-align: center; color: #c0caf5; font-family: monospace;">' +
          'No pane ID specified. Use ?pane=ID in the URL.' +
          '</div>';
        return;
      }

      document.title = 'Terminal — ' + paneId;

      var term = new Terminal({
        theme: {
          background: '#1a1b26',
          foreground: '#c0caf5',
          cursor: '#c0caf5',
          cursorAccent: '#1a1b26',
          selectionBackground: '#33467c',
          black: '#15161e',
          red: '#f7768e',
          green: '#9ece6a',
          yellow: '#e0af68',
          blue: '#7aa2f7',
          magenta: '#bb9af7',
          cyan: '#7dcfff',
          white: '#a9b1d6',
          brightBlack: '#414868',
          brightRed: '#f7768e',
          brightGreen: '#9ece6a',
          brightYellow: '#e0af68',
          brightBlue: '#7aa2f7',
          brightMagenta: '#bb9af7',
          brightCyan: '#7dcfff',
          brightWhite: '#c0caf5',
        },
        fontFamily: "'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace",
        fontSize: 14,
        cursorBlink: true,
      });

      var fitAddon = new FitAddon.FitAddon();
      var webLinksAddon = new WebLinksAddon.WebLinksAddon();

      term.loadAddon(fitAddon);
      term.loadAddon(webLinksAddon);

      var container = document.getElementById('terminal');
      term.open(container);

      setTimeout(function () {
        fitAddon.fit();
      }, 50);

      // WebSocket connection
      var wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      var wsUrl = wsProtocol + '//' + location.host + '/ws/terminal/' + encodeURIComponent(paneId);
      var authToken = null;
      try { authToken = localStorage.getItem('tmux_auth_token'); } catch (_e) {}
      if (authToken) wsUrl += '?token=' + encodeURIComponent(authToken);
      var ws = new WebSocket(wsUrl);

      ws.onopen = function () {
        if (term.cols && term.rows) {
          ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
        }
      };

      function _copyToClipboard(text) {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).catch(function () {});
          return;
        }
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px;opacity:0;';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try { document.execCommand('copy'); } catch (_e) { /* ignore */ }
        document.body.removeChild(ta);
      }

      ws.onmessage = function (e) {
        try {
          var msg = JSON.parse(e.data);
          if (msg.type === 'output') {
            term.write(msg.data);
          } else if (msg.type === 'clipboard') {
            _copyToClipboard(msg.data);
          }
        } catch (_err) {
          // Ignore
        }
      };

      ws.onclose = function () {
        term.write('\r\n\x1b[31m[Connection closed]\x1b[0m\r\n');
      };

      term.onData(function (data) {
        if (ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'input', data: data }));
        }
      });

      // Auto-resize
      var resizeObserver = new ResizeObserver(function () {
        fitAddon.fit();
        if (ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
        }
      });
      resizeObserver.observe(container);

      // Cleanup on page unload
      window.addEventListener('beforeunload', function () {
        resizeObserver.disconnect();
        ws.close();
        term.dispose();
      });
    })();
  </script>
</body>
</html>
