<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Login — Tmux Panel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary, #1a1b26);
      color: var(--text-primary, #c0caf5);
    }
    .login-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .login-card {
      width: 100%;
      max-width: 380px;
      background: var(--bg-card, #24283b);
      border-radius: 12px;
      padding: 32px 28px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .login-title {
      font-size: 1.4rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 8px;
      color: var(--text-primary, #c0caf5);
    }
    .login-subtitle {
      font-size: 0.85rem;
      text-align: center;
      color: var(--text-muted, #565f89);
      margin-bottom: 24px;
    }
    .login-field {
      margin-bottom: 16px;
    }
    .login-field label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted, #565f89);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .login-field input {
      width: 100%;
      padding: 10px 12px;
      font-size: 0.95rem;
      border: 1px solid var(--border, #3b4261);
      border-radius: 8px;
      background: var(--bg-primary, #1a1b26);
      color: var(--text-primary, #c0caf5);
      outline: none;
      transition: border-color 0.2s;
    }
    .login-field input:focus {
      border-color: var(--accent-blue, #7aa2f7);
    }
    .login-btn {
      display: block;
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: var(--accent-blue, #7aa2f7);
      color: var(--bg-primary, #1a1b26);
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .login-btn:hover { opacity: 0.9; }
    .login-btn:active { opacity: 0.8; }
    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .login-error {
      display: none;
      margin-top: 12px;
      padding: 8px 12px;
      font-size: 0.85rem;
      color: var(--accent-red, #f7768e);
      background: rgba(247, 118, 142, 0.1);
      border-radius: 6px;
      text-align: center;
    }
    .login-error.visible { display: block; }
    .login-trust {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      font-size: 0.85rem;
      color: var(--text-muted, #565f89);
      cursor: pointer;
      user-select: none;
    }
    .login-trust input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent-blue, #7aa2f7);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-title">Tmux Web Panel</div>
      <div class="login-subtitle">Sign in to continue</div>
      <form id="login-form">
        <div class="login-field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="login-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <label class="login-trust">
          <input type="checkbox" id="trusted"> Trust this device
        </label>
        <button type="submit" class="login-btn" id="login-btn">Sign In</button>
      </form>
      <div class="login-error" id="login-error"></div>
    </div>
  </div>
  <script src="/js/theme.js"></script>
  <script>
    (function () {
      var TOKEN_KEY = 'tmux_auth_token';

      // If already authenticated, redirect to main app
      var existing = localStorage.getItem(TOKEN_KEY);
      if (existing) {
        fetch('/api/status', {
          headers: { 'Authorization': 'Bearer ' + existing },
        })
          .then(function (res) {
            if (res.ok) window.location.href = '/';
          })
          .catch(function () {});
      }

      var form = document.getElementById('login-form');
      var errorEl = document.getElementById('login-error');
      var btn = document.getElementById('login-btn');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        errorEl.classList.remove('visible');
        btn.disabled = true;
        btn.textContent = 'Signing in...';

        var username = document.getElementById('username').value;
        var password = document.getElementById('password').value;
        var trusted = document.getElementById('trusted').checked;

        fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password, trusted: trusted }),
        })
          .then(function (res) { return res.json(); })
          .then(function (data) {
            if (data.success && data.data && data.data.token) {
              localStorage.setItem(TOKEN_KEY, data.data.token);
              window.location.href = '/';
            } else {
              showError(data.error || 'Login failed');
            }
          })
          .catch(function () {
            showError('Network error — please try again');
          })
          .finally(function () {
            btn.disabled = false;
            btn.textContent = 'Sign In';
          });
      });

      function showError(msg) {
        errorEl.textContent = msg;
        errorEl.classList.add('visible');
      }
    })();
  </script>
</body>
</html>
