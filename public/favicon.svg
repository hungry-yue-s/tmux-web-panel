<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#1e2030"/>
  <!-- Vertical split line -->
  <line x1="16" y1="3" x2="16" y2="29" stroke="#7aa2f7" stroke-width="2" stroke-linecap="round"/>
  <!-- Horizontal split line (left half only) -->
  <line x1="3" y1="16" x2="16" y2="16" stroke="#7aa2f7" stroke-width="2" stroke-linecap="round"/>
  <!-- Top-left pane: green prompt -->
  <text x="5" y="13" font-family="monospace" font-size="10" font-weight="bold" fill="#9ece6a">›_</text>
  <!-- Bottom-left pane: dot -->
  <circle cx="9" cy="23" r="2" fill="#bb9af7"/>
  <!-- Right pane: lines -->
  <rect x="20" y="8" width="8" height="2" rx="1" fill="#c0caf5" opacity="0.7"/>
  <rect x="20" y="13" width="6" height="2" rx="1" fill="#c0caf5" opacity="0.5"/>
  <rect x="20" y="18" width="8" height="2" rx="1" fill="#c0caf5" opacity="0.7"/>
  <rect x="20" y="23" width="5" height="2" rx="1" fill="#c0caf5" opacity="0.5"/>
</svg>
