<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/png" href="/app-icon.png?v=2">
  <link rel="apple-touch-icon" href="/app-icon.png?v=2">
  <title>Anymux</title>
  <style>html { -webkit-text-size-adjust: 100%; }</style>
  <!--ui:head-->
</head>
<body>

  <div class="ms-app sidebar-collapsed">
    <header class="workspace-chrome" aria-label="工作台">
      <div class="brand">
        <div class="brand-mark">&gt;_</div>
        <div class="brand-copy">
          <div class="brand-name"><span class="brand-long">Anymux</span><span class="brand-short">Tmux</span></div>
          <div class="brand-meta">工作台</div>
        </div>

        <button class="sidebar-toggle" data-action="sidebar-toggle" aria-label="展开侧边栏" aria-expanded="false" title="展开侧边栏"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect class="sidebar-panel" x="3" y="4" width="6" height="16" rx="1"/><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
      </div>
      <header class="ms-topbar" id="ms-topbar">
        <div class="crumbs"><div class="window-context" id="ms-window-context"><div class="crumb" id="ms-crumb">本机</div><h1 class="page-title" id="ms-page-title">终端工作台</h1></div></div>
        <button type="button" class="workspace-jump" onclick="CommandPalette.open(this)" aria-label="搜索窗口与命令" title="搜索窗口与命令 (⌘K / Ctrl+K)"><svg class="ms-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><span>快速切换</span><kbd>⌘K</kbd></button>
        <div class="top-actions" id="ms-top-actions"></div>
        <button class="icon-btn workspace-notification" data-action="notifications" aria-label="通知" title="通知"><svg class="ms-icon" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg></button>
      </header>
    </header>
    <aside class="ms-sidebar">
      <div class="sidebar-resizer" role="separator" aria-label="调整侧边栏宽度" aria-orientation="vertical" aria-valuemin="220" aria-valuemax="360" aria-valuenow="248" tabindex="0"></div>
      <div class="server-context" id="ms-server-context"></div>
      <div class="sidebar-footer">
        <button class="nav-item" data-route="#/terminal/local" data-terminal-home aria-label="终端" title="终端"><svg class="ms-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/></svg><span>终端</span></button>
        <button class="nav-item" data-route="#/servers" aria-label="状态" title="状态"><svg class="ms-icon" viewBox="0 0 24 24"><path d="M20 13a8 8 0 1 0-16 0"/><path d="m12 13 4-4"/><path d="M5 19h14"/></svg><span>状态</span></button>
        <button class="nav-item" data-route="#/settings" aria-label="设置" title="设置"><svg class="ms-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .4 1.9l-2.9 2.9a1.7 1.7 0 0 0-1.9-.4 1.7 1.7 0 0 0-1 1.6h-4a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.4l-2.9-2.9a1.7 1.7 0 0 0 .4-1.9A1.7 1.7 0 0 0 3 14v-4a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.4-1.9l2.9-2.9a1.7 1.7 0 0 0 1.9.4A1.7 1.7 0 0 0 10 3h4a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.4l2.9 2.9a1.7 1.7 0 0 0-.4 1.9 1.7 1.7 0 0 0 1.6 1v4a1.7 1.7 0 0 0-1.6 1Z"/></svg><span>设置</span></button>
      </div>
    </aside>

    <main class="ms-main">
      <header class="mobile-header">
        <button class="mobile-workspace-trigger" data-action="mobile-workspace" aria-label="工作区与导航菜单" aria-haspopup="dialog" aria-expanded="false">
          <span class="mobile-workspace-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="7" y="7" width="14" height="14" rx="4"/><path d="M16 3H7a4 4 0 0 0-4 4v9M11 12h6M11 16h3"/></svg></span>
          <span class="mobile-title"><strong id="ms-mobile-title">终端工作台</strong><small id="ms-mobile-subtitle">本机</small></span>
        </button>
        <button type="button" class="mobile-header-action" data-action="mobile-search" aria-label="搜索窗口与命令"><svg class="ms-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg></button>
        <button type="button" class="mobile-header-action notification-bell" data-action="notifications" aria-label="通知"><svg class="ms-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg><span class="notification-bell-count" style="display:none">0</span></button>
        <div class="mobile-tools" id="ms-mobile-tools" aria-hidden="true"></div>
      </header>
      <div class="ms-content" id="ms-view"></div>
      <nav class="mobile-dock" aria-label="工作台导航">
        <button type="button" data-route="#/terminal/local" data-terminal-home><svg class="ms-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m7 9 3 3-3 3M13 15h4"/></svg><span>终端</span></button>
        <button type="button" data-action="mobile-workspace" aria-label="会话与窗口" aria-haspopup="dialog" aria-expanded="false"><svg class="ms-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="14" height="14" rx="3"/><path d="M7 21h11a3 3 0 0 0 3-3V7M7 8h6M7 12h4"/></svg><span>会话</span></button>
        <button type="button" data-action="mobile-files"><svg class="ms-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v9H3Z"/></svg><span>文件</span></button>
        <button type="button" data-route="#/servers"><svg class="ms-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13a8 8 0 1 0-16 0M12 13l4-4M5 19h14"/></svg><span>状态</span></button>
        <button type="button" data-route="#/settings"><svg class="ms-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg><span>设置</span></button>
      </nav>
    </main>
  </div>



  <div class="ms-popover" id="ms-server-popover" hidden></div>
  <div class="ms-modal-backdrop" id="ms-modal" hidden></div>
  <div class="ms-toast" id="ms-toast" role="status" aria-live="polite"></div>
  <!--ui:body-->
  <script>
    (function () {
      function boot() {
        Promise.resolve(window.MsApp.start()).catch(function (err) {
          console.error('[MsApp] startup failed:', err);
        });
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
      else boot();
    })();
  </script>
</body>
</html>
