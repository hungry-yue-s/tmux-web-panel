<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tmux Panel · 多服务器 UI Demo</title>
  <style>
    :root {
      --bg-primary: #1a1b26;
      --bg-deep: #16161e;
      --bg-card: #24283b;
      --bg-hover: #292e42;
      --border: #3b4261;
      --border-subtle: #2f3450;
      --text-primary: #c0caf5;
      --text-secondary: #a9b1d6;
      --text-muted: #565f89;
      --blue: #7aa2f7;
      --green: #9ece6a;
      --red: #f7768e;
      --yellow: #e0af68;
      --purple: #bb9af7;
      --cyan: #7dcfff;
      --radius-sm: 7px;
      --radius-md: 10px;
      --shadow: 0 14px 40px rgba(0, 0, 0, .2);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    button, input { font: inherit; }
    button { color: inherit; }
    body {
      min-width: 320px;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }
    .mono { font-family: "SFMono-Regular", Consolas, monospace; }
    .app {
      --sidebar-width: 248px;
      --sidebar-effective-width: var(--sidebar-width);
      display: grid;
      grid-template-columns: var(--sidebar-effective-width) minmax(0, 1fr);
      min-height: 100vh;
      transition: grid-template-columns .18s ease;
    }
    .app.sidebar-collapsed { --sidebar-effective-width: 152px; }
    .app.resizing-sidebar { transition: none; cursor: col-resize; user-select: none; }
    .sidebar {
      position: sticky;
      z-index: 25;
      top: 0;
      width: var(--sidebar-effective-width);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: visible;
      border-right: 1px solid var(--border-subtle);
      background: linear-gradient(180deg, #191925 0%, var(--bg-deep) 42%);
      box-shadow: 6px 0 22px rgba(0, 0, 0, .07);
      transition: width .18s ease, box-shadow .18s ease;
    }
    .sidebar-toggle {
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 7px;
      color: var(--text-muted);
      background: transparent;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }
    .sidebar-toggle:hover, .sidebar-toggle:focus-visible { color: var(--text-primary); border-color: var(--border); background: var(--bg-hover); }
    .sidebar-resizer { position: absolute; z-index: 11; top: 0; right: -3px; width: 6px; height: 100%; cursor: col-resize; touch-action: none; }
    .sidebar-resizer::after { content: ""; position: absolute; inset: 0 2px; background: transparent; transition: background .15s ease; }
    .sidebar-resizer:hover::after, .app.resizing-sidebar .sidebar-resizer::after { background: var(--blue); }
    .brand {
      height: 60px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      border-bottom: 0;
    }
    .brand-mark {
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(122, 162, 247, .35);
      border-radius: 7px;
      color: var(--blue);
      background: rgba(122, 162, 247, .1);
      font: 700 14px/1 "SFMono-Regular", Consolas, monospace;
    }
    .brand-copy { min-width: 0; flex: 1; }
    .brand-name { overflow: hidden; font-size: 13px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .brand-short { display: none; }
    .brand-meta { overflow: hidden; color: var(--text-muted); font-size: 9px; letter-spacing: .08em; text-overflow: ellipsis; white-space: nowrap; }
    .icon-btn {
      width: 28px;
      height: 28px;
      display: inline-grid;
      place-items: center;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      background: transparent;
      cursor: pointer;
    }
    .icon-btn:hover, .icon-btn:focus-visible { color: var(--text-primary); border-color: var(--border); background: var(--bg-hover); }
    .icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .section-label {
      margin: 9px 8px 7px;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .nav-item {
      width: 100%;
      min-height: 40px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 10px;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      background: transparent;
      cursor: pointer;
      text-align: left;
    }
    .nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
    .nav-item.active {
      color: var(--text-primary);
      border-color: rgba(122, 162, 247, .2);
      background: rgba(122, 162, 247, .11);
      box-shadow: inset 3px 0 0 rgba(122, 162, 247, .8);
    }
    .nav-item .icon { width: 17px; color: var(--text-muted); }
    .nav-item.active .icon { color: var(--blue); }
    .nav-item .count { margin-left: auto; color: var(--text-muted); font: 11px "SFMono-Regular", Consolas, monospace; }
    .server-context { flex: 1; min-height: 0; overflow: auto; padding: 8px 10px 12px; }
    .server-switcher {
      width: 100%;
      display: grid;
      grid-template-columns: 9px minmax(0, 1fr) 15px;
      align-items: center;
      gap: 9px;
      min-height: 44px;
      padding: 7px 9px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--text-primary);
      background: rgba(36, 40, 59, .48);
      cursor: pointer;
      text-align: left;
    }
    .server-switcher:hover { border-color: var(--border-subtle); background: rgba(36, 40, 59, .76); }
    .server-switcher strong, .server-switcher small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .server-switcher strong { font-size: 12px; }
    .server-switcher small { color: var(--text-muted); font-size: 10px; }
    .dot { width: 8px; height: 8px; display: inline-block; border-radius: 50%; background: var(--text-muted); }
    .dot.online { background: var(--green); box-shadow: 0 0 0 3px rgba(158, 206, 106, .1); }
    .dot.warn { background: var(--yellow); box-shadow: 0 0 0 3px rgba(224, 175, 104, .1); }
    .dot.offline, .dot.auth { background: var(--red); box-shadow: 0 0 0 3px rgba(247, 118, 142, .1); }
    .subnav { margin-top: 12px; padding-top: 0; border-top: 0; }
    .tree-section-head { min-height: 28px; display: flex; align-items: center; gap: 8px; margin: 0 2px 4px 8px; color: var(--text-muted); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .tree-section-head span { flex: 1; }
    .tree-add-button { width: 24px; height: 24px; display: inline-grid; place-items: center; padding: 0; border: 1px solid transparent; border-radius: 6px; color: var(--text-muted); background: transparent; cursor: pointer; font-size: 16px; line-height: 1; }
    .tree-add-button:hover, .tree-add-button:focus-visible { color: var(--text-primary); border-color: var(--border); background: var(--bg-hover); }
    .tree { display: grid; gap: 4px; margin: 0 0 4px; }
    .tree-session-group { padding: 3px; border: 0; border-radius: 8px; background: rgba(36, 40, 59, .24); }
    .tree-session-group.active { background: rgba(122, 162, 247, .07); }
    .tree-session-row { display: flex; align-items: center; min-height: 34px; border: 0; border-radius: 6px; background: transparent; }
    .tree-session-row .tree-item { min-width: 0; flex: 1; color: var(--text-primary); font-weight: 700; }
    .tree-session-row .tree-add-button { flex: 0 0 24px; opacity: 0; }
    .tree-session-row:hover .tree-add-button, .tree-session-row.active .tree-add-button { opacity: 1; }
    .tree-session-row.active { background: transparent; }
    .tree-session-row.active .tree-item { color: var(--text-primary); background: transparent; }
    .tree-session-row .cmd { color: var(--text-muted); }
    .tree-window-list { display: grid; gap: 1px; margin: 0; padding: 1px 0 2px; border: 0; }
    .tree-window-list .tree-item { min-height: 31px; padding: 6px 8px; border: 0; border-radius: 6px; background: transparent; }
    .tree-window-list .tree-item:hover { background: rgba(41, 46, 66, .72); }
    .tree-window-list .tree-item.active { position: relative; color: var(--text-primary); background: rgba(122, 162, 247, .13); box-shadow: none; }
    .tree-window-list .tree-item.active::before { content: ""; position: absolute; left: 0; width: 2px; height: 16px; border-radius: 2px; background: var(--blue); }
    .tree-item {
      width: 100%;
      display: grid;
      grid-template-columns: 16px minmax(0, 1fr) auto;
      align-items: center;
      gap: 5px;
      padding: 6px 7px;
      border: 0;
      border-radius: 7px;
      color: var(--text-muted);
      background: transparent;
      cursor: pointer;
      text-align: left;
      font-size: 12px;
    }
    .tree-item:hover, .tree-item.active { color: var(--text-primary); background: rgba(122, 162, 247, .1); }
    .tree-item .index { opacity: .6; font-family: "SFMono-Regular", Consolas, monospace; }
    .tree-item .cmd { font-size: 10px; opacity: .62; }
    .sidebar-footer { display: grid; gap: 2px; padding: 8px 10px; border-top: 1px solid var(--border-subtle); background: transparent; }
    .sidebar-footer .nav-item { min-height: 34px; border-color: transparent; border-radius: 6px; background: transparent; }
    .sidebar-footer .nav-item:hover { border-color: transparent; background: var(--bg-hover); }
    .sidebar-collapsed .brand { padding: 0 10px; }
    .sidebar-collapsed .brand-mark { width: 28px; height: 28px; flex-basis: 28px; font-size: 11px; }
    .sidebar-collapsed .brand-meta, .sidebar-collapsed .brand .icon-btn { display: none; }
    .sidebar-collapsed .brand-name { font-size: 12px; }
    .sidebar-collapsed .brand-long { display: none; }
    .sidebar-collapsed .brand-short { display: inline; }
    .sidebar-collapsed .server-context { padding: 8px; overflow: hidden auto; }
    .sidebar-collapsed .server-switcher { grid-template-columns: 8px minmax(0, 1fr); gap: 8px; min-height: 40px; padding: 6px 8px; }
    .sidebar-collapsed .server-switcher > :last-child, .sidebar-collapsed .server-switcher small { display: none; }
    .sidebar-collapsed .subnav { margin-top: 10px; }
    .sidebar-collapsed .tree-section-head { margin-left: 7px; }
    .sidebar-collapsed .tree-section-head .tree-add-button { display: none; }
    .sidebar-collapsed .tree-session-row .tree-add-button, .sidebar-collapsed .tree-session-row .cmd { display: none; }
    .sidebar-collapsed .tree-session-row .tree-item { grid-template-columns: 14px minmax(0, 1fr); }
    .sidebar-collapsed .tree-window-list .tree-item { grid-template-columns: minmax(0, 1fr); }
    .sidebar-collapsed .tree-window-list .index, .sidebar-collapsed .tree-window-list .cmd { display: none; }
    .sidebar-collapsed .sidebar-footer { padding: 8px; }
    .sidebar-collapsed .nav-item { padding: 7px 8px; }
    .workspace-missing { padding: 10px; border-radius: 8px; background: rgba(36, 40, 59, .34); }
    .workspace-missing strong { display: block; font-size: 12px; }
    .workspace-missing p { margin: 4px 0 10px; color: var(--text-muted); font-size: 10px; line-height: 1.5; }
    .workspace-missing-actions { display: grid; gap: 5px; }
    .workspace-missing .btn { width: 100%; min-height: 32px; padding: 6px 8px; font-size: 10px; }
    .workspace-missing .btn.ghost { border-color: transparent; color: var(--text-muted); }
    .provider-badge { margin-left: auto; padding: 2px 5px; border-radius: 4px; color: var(--cyan); background: rgba(125, 207, 255, .09); font: 700 8px "SFMono-Regular", Consolas, monospace; letter-spacing: .04em; }
    .ssh-lifecycle { margin: 6px 7px 0; color: var(--text-muted); font-size: 9px; line-height: 1.45; }
    .sidebar-collapsed .workspace-missing { padding: 8px; }
    .sidebar-collapsed .workspace-missing p { display: none; }
    .sidebar-collapsed .workspace-missing strong { margin-bottom: 7px; overflow: hidden; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .sidebar-collapsed .ssh-lifecycle { display: none; }

    .main { min-width: 0; min-height: 100vh; }
    .topbar {
      min-height: 60px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 8px 28px;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(26, 27, 38, .86);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .topbar.terminal-layout {
      width: auto;
      min-height: 46px;
      margin: 8px 16px 6px;
      padding: 4px 8px;
      border: 1px solid rgba(59, 66, 97, .44);
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(42, 47, 61, .96), rgba(37, 41, 54, .96));
      box-shadow: 0 2px 10px rgba(0, 0, 0, .14), inset 0 1px 0 rgba(192, 202, 245, .035);
    }
    .terminal-layout .crumbs { position: absolute; left: 50%; max-width: min(520px, 42vw); transform: translateX(-50%); text-align: center; pointer-events: none; }
    .terminal-layout .crumb { display: none; }
    .terminal-layout .page-title { overflow: hidden; color: var(--text-primary); font-size: 13px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; text-shadow: 0 1px 0 rgba(0, 0, 0, .2); }
    .terminal-layout .top-actions { margin-left: auto; gap: 2px; padding: 2px; border: 1px solid rgba(47, 52, 80, .72); border-radius: 7px; background: rgba(22, 22, 30, .36); box-shadow: inset 0 1px 0 rgba(192, 202, 245, .025); }
    .terminal-layout .terminal-tool-button { width: 30px; min-width: 30px; height: 30px; min-height: 30px; padding: 0; border-color: transparent; background: transparent; }
    .terminal-tool-button.active { color: var(--blue); border-color: rgba(122, 162, 247, .35); background: rgba(122, 162, 247, .12); }
    .terminal-tool-group { display: flex; gap: 1px; padding-left: 3px; border-left: 1px solid var(--border-subtle); }
    .terminal-font-glyph { display: inline-flex; align-items: baseline; gap: 1px; font: 700 11px/1 "SFMono-Regular", Consolas, monospace; }
    .terminal-font-glyph span { color: var(--text-muted); font-size: 10px; }
    .crumbs { min-width: 0; flex: 1; }
    .crumb { color: var(--text-muted); font-size: 11px; }
    .page-title { margin: 2px 0 0; font-size: 18px; line-height: 1.2; }
    .top-actions { display: flex; gap: 8px; }
    .btn {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      background: var(--bg-card);
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
    }
    .btn:hover, .btn:focus-visible { border-color: rgba(122, 162, 247, .65); color: var(--text-primary); }
    .btn.primary { border-color: rgba(122, 162, 247, .55); color: #fff; background: #5277c3; }
    .btn.ghost { background: transparent; }
    .content { max-width: 1440px; margin: 0 auto; padding: 24px 28px 48px; }
    .content.terminal-mode { height: calc(100vh - 60px); max-width: none; overflow: hidden; padding: 0 16px; }
    .terminal-mode .terminal-stage { height: 100%; margin-top: 0; }
    .terminal-mode .terminal-preview, .terminal-mode .terminal-body { height: 100%; }
    .terminal-mode .terminal-preview { border: 0; border-radius: 0; background: #101017; box-shadow: none; }
    .intro { margin-bottom: 20px; }
    .intro h2 { margin: 0 0 5px; font-size: 20px; }
    .intro p { margin: 0; color: var(--text-muted); font-size: 12px; }
    .mobile-actions { display: none; }
    .grid { display: grid; gap: 14px; }
    .kpi-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .two-col { grid-template-columns: minmax(0, 1.45fr) minmax(300px, .8fr); }
    .three-col { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .card {
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      background: linear-gradient(145deg, rgba(36, 40, 59, .96), rgba(31, 34, 50, .96));
      box-shadow: 0 8px 24px rgba(0, 0, 0, .08);
    }
    .kpi { padding: 16px; }
    .kpi-top { display: flex; align-items: center; justify-content: space-between; color: var(--text-muted); font-size: 11px; }
    .kpi-value { margin-top: 8px; font: 700 25px/1 "SFMono-Regular", Consolas, monospace; }
    .kpi-note { margin-top: 8px; color: var(--text-muted); font-size: 10px; }
    .blue { color: var(--blue); } .green { color: var(--green); } .yellow { color: var(--yellow); } .red { color: var(--red); } .purple { color: var(--purple); }
    .section { margin-top: 20px; }
    .section-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .section-head h3 { margin: 0; flex: 1; font-size: 13px; }
    .section-head span { color: var(--text-muted); font-size: 10px; }
    .list { overflow: hidden; }
    .list-row {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(190px, 1.5fr) minmax(130px, 1fr) repeat(3, minmax(72px, .55fr)) minmax(95px, .7fr) 30px;
      align-items: center;
      gap: 12px;
      min-height: 58px;
      padding: 9px 14px;
      border: 0;
      border-bottom: 1px solid var(--border-subtle);
      color: inherit;
      background: transparent;
      text-align: left;
    }
    button.list-row { cursor: pointer; }
    button.list-row:hover { background: var(--bg-hover); }
    .list-row:last-child { border-bottom: 0; }
    .list-head { min-height: 34px; color: var(--text-muted); background: rgba(22, 22, 30, .45); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; }
    .server-name { min-width: 0; display: flex; align-items: center; gap: 10px; }
    .server-name-copy { min-width: 0; }
    .server-name strong, .server-name small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .server-name strong { font-size: 12px; }
    .server-name small, .muted { color: var(--text-muted); font-size: 10px; }
    .metric { font: 11px "SFMono-Regular", Consolas, monospace; }
    .metric-bar { height: 3px; margin-top: 5px; overflow: hidden; border-radius: 5px; background: var(--bg-deep); }
    .metric-bar i { display: block; height: 100%; border-radius: inherit; background: var(--blue); }
    .badge { display: inline-flex; align-items: center; gap: 5px; width: fit-content; padding: 3px 7px; border-radius: 999px; font-size: 9px; font-weight: 700; }
    .badge.green { color: var(--green); background: rgba(158, 206, 106, .1); }
    .badge.yellow { color: var(--yellow); background: rgba(224, 175, 104, .1); }
    .badge.red { color: var(--red); background: rgba(247, 118, 142, .1); }
    .badge.muted { color: var(--text-muted); background: rgba(86, 95, 137, .12); }
    .attention-row, .recent-row {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-subtle);
      cursor: pointer;
    }
    .attention-row:last-child, .recent-row:last-child { border-bottom: 0; }
    .attention-row:hover, .recent-row:hover { background: var(--bg-hover); }
    .row-copy { min-width: 0; flex: 1; }
    .row-copy strong, .row-copy span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-copy strong { font-size: 12px; }
    .row-copy span { color: var(--text-muted); font-size: 10px; }
    .time { color: var(--text-muted); font: 9px "SFMono-Regular", Consolas, monospace; }
    .filters { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .search {
      min-width: 180px;
      flex: 1;
      height: 36px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      outline: 0;
      color: var(--text-primary);
      background: var(--bg-deep);
    }
    .search:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(122, 162, 247, .1); }
    .chip { padding: 7px 10px; border: 1px solid var(--border); border-radius: 999px; color: var(--text-muted); background: transparent; cursor: pointer; font-size: 10px; }
    .chip.active { color: var(--blue); border-color: rgba(122, 162, 247, .45); background: rgba(122, 162, 247, .1); }
    .server-hero { display: flex; align-items: center; gap: 15px; padding: 18px; margin-bottom: 14px; }
    .server-hero .server-icon { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 11px; color: var(--blue); background: rgba(122, 162, 247, .1); }
    .server-hero-copy { min-width: 0; flex: 1; }
    .server-hero-copy h2 { margin: 0 0 3px; font-size: 17px; }
    .server-hero-copy p { margin: 0; color: var(--text-muted); font: 10px "SFMono-Regular", Consolas, monospace; }
    .hero-actions { display: flex; gap: 7px; }
    .tabs { display: flex; gap: 4px; overflow-x: auto; padding: 4px; margin-bottom: 14px; border: 1px solid var(--border-subtle); border-radius: 10px; background: var(--bg-deep); }
    .tab { flex: 0 0 auto; padding: 7px 12px; border: 0; border-radius: 7px; color: var(--text-muted); background: transparent; cursor: pointer; font-size: 11px; font-weight: 650; }
    .tab.active { color: var(--text-primary); background: var(--bg-card); box-shadow: 0 2px 8px rgba(0, 0, 0, .2); }
    .capability { padding: 15px; }
    .capability-head { display: flex; align-items: center; gap: 8px; }
    .capability-head strong { flex: 1; font-size: 12px; }
    .capability p { margin: 10px 0 0; color: var(--text-muted); font-size: 10px; }
    .chart-card { padding: 16px; overflow: hidden; }
    .chart-title { display: flex; justify-content: space-between; align-items: start; }
    .chart-title strong { font-size: 12px; }
    .chart-title span { color: var(--text-muted); font: 9px "SFMono-Regular", Consolas, monospace; }
    .chart { width: 100%; height: 180px; margin-top: 14px; }
    .chart-grid { stroke: #2f3450; stroke-width: 1; }

  <script>

    const servers = [

    const sessions = [
      { name: 'DataAnt', windows: ['三绿 · codex', 'OSS · fish', '风控点总结 · codex', 'vmos · adb'] },
      { name: 'DogFooding', windows: ['code-rl · claude', 'Qwen-windows · pwsh', 'Frontier-Bench · fish'] },

    ];

    let filter = 'all';
    let query = '';
    let toastTimer;
    let activeServerId = 'local';
    let sidebarWidth = 248;
    let resizingSidebar = false;

    function icon(name) { return icons[name] || ''; }
    function serverById(id) { return servers.find((server) => server.id === id) || servers[0]; }
    function canUseSsh(server) { return server.status === 'online' || server.status === 'warn'; }
    function workspaceProvider(server) { return server.tmux ? 'tmux' : canUseSsh(server) ? 'ssh' : 'unavailable'; }
    function route() {
      const parts = (location.hash || '#/terminal/local').replace(/^#\/?/, '').split('/').filter(Boolean);
      if (parts[0] === 'terminal' || parts[0] === 'home') return { area: 'terminal', serverId: parts[1] || 'local' };
      if (parts[0] === 'server' && parts[2] === 'tmux') return { area: 'terminal', serverId: parts[1] || 'local' };
      if (parts[0] === 'server') return { area: 'server', serverId: parts[1] || 'local', section: parts[2] || 'overview' };
      return { area: parts[0] || 'terminal' };
    }
    function statusBadge(server) {
      const tone = server.status === 'online' ? 'green' : server.status === 'warn' ? 'yellow' : 'red';
      return '<span class="badge ' + tone + '"><span class="dot ' + server.status + '"></span>' + server.statusText + '</span>';
    }
    function metric(value, suffix) { return value == null ? '<span class="muted">—</span>' : '<span class="metric">' + value + suffix + '</span>'; }
    function metricCell(value) {
      if (value == null) return '<span class="muted">—</span>';
      const color = value >= 85 ? 'var(--red)' : value >= 70 ? 'var(--yellow)' : 'var(--blue)';
      return '<div><span class="metric">' + value + '%</span><div class="metric-bar"><i style="width:' + value + '%;background:' + color + '"></i></div></div>';
    }
    function setHeader(crumb, title, actions) {

      document.getElementById('top-actions').innerHTML = actions || '';

      return '<button class="btn terminal-tool-button ' + (active ? 'active' : '') + '" data-action="terminal-tool" title="' + label + '" aria-label="' + label + '">' + content + '</button>';
    }
    function terminalToolIcon(paths) {
      return '<svg class="icon" viewBox="0 0 24 24">' + paths + '</svg>';
    }
    function setTerminalHeader(server, provider) {
      const sshMode = provider === 'ssh';
      document.querySelector('.topbar').classList.add('terminal-layout');
      document.getElementById('page-title').textContent = sshMode ? server.name + ' / SSH Session / shell' : server.name + ' / DataAnt / 2 风控点总结';

        terminalTool(sshMode ? '重新连接 SSH' : '刷新终端', icon('refresh'), false) +
        terminalTool('标签页模式', terminalToolIcon('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 6.5h4"/>'), false) +

        kpi('磁盘', server.disk == null ? '—' : server.disk + '%', server.disk >= 80 ? 'yellow' : 'green', '根卷 / System Data') +

        '<div><div class="section-head"><h3>Top 压力来源</h3><span>按加权压力排序</span></div><div class="card">' + pressureRows() + '</div></div></div>';

    function terminalView(server, provider) {

    function setSidebarWidth(width) {

    document.addEventListener('click', (event) => {

      if (serverTarget) { location.hash = '#/server/' + serverTarget.dataset.server + '/overview'; document.getElementById('server-popover').hidden = true; return; }
      const filterTarget = event.target.closest('[data-filter]');
      if (filterTarget) { filter = filterTarget.dataset.filter; render(); return; }
      const actionTarget = event.target.closest('[data-action]');
      if (!actionTarget) {
        if (!event.target.closest('#server-popover')) document.getElementById('server-popover').hidden = true;
        return;
      }
      const action = actionTarget.dataset.action;
      if (action === 'server-switcher' || action === 'mobile-server') showPopover(actionTarget);
      if (action === 'add-server') document.getElementById('add-modal').hidden = false;
      if (action === 'close-modal') document.getElementById('add-modal').hidden = true;
      if (action === 'demo-connect') { document.getElementById('add-modal').hidden = true; showToast('Demo：接下来应进入主机指纹确认与分层检测。'); }
      if (action === 'probe') showToast('正在检测 TCP、SSH、认证、指标和 tmux 能力…');
      if (action === 'edit-server') showToast('Demo：这里进入当前服务器的连接配置。');
      if (action === 'notifications') showNotifications();
      if (action === 'sidebar-toggle') {
        setSidebarCollapsed(!document.querySelector('.app').classList.contains('sidebar-collapsed'));
      }
      if (action === 'new-session') showToast('将在当前服务器中创建 Session，作用域清晰可见。');
      if (action === 'new-window') showToast('将在 ' + (actionTarget.dataset.session || 'DataAnt') + ' 中创建 Window，完成后直接进入。');
      if (action === 'new-ssh-window') showToast('将创建新的 SSH PTY，并作为当前 Session 的 Window 呈现。');
      if (action === 'terminal-tool') showToast('Demo：终端工具栏操作保持在当前服务器范围内。');
    });
    document.addEventListener('input', (event) => {
      if (event.target.id === 'server-search') { query = event.target.value.trim().toLowerCase(); render(); const input = document.getElementById('server-search'); input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
    });
    const sidebar = document.querySelector('.sidebar');
    const sidebarResizer = document.querySelector('.sidebar-resizer');
    sidebarResizer.addEventListener('pointerdown', (event) => {
      if (innerWidth <= 760) return;
      resizingSidebar = true;
      setSidebarCollapsed(false);
      document.querySelector('.app').classList.add('resizing-sidebar');
      sidebarResizer.setPointerCapture(event.pointerId);
      setSidebarWidth(event.clientX);
    });
    sidebarResizer.addEventListener('pointermove', (event) => { if (resizingSidebar) setSidebarWidth(event.clientX); });
    sidebarResizer.addEventListener('pointerup', (event) => {
      resizingSidebar = false;
      document.querySelector('.app').classList.remove('resizing-sidebar');
      sidebarResizer.releasePointerCapture(event.pointerId);
    });
    sidebarResizer.addEventListener('keydown', (event) => {
      if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight' && event.key !== 'Home') return;
      event.preventDefault();
      setSidebarCollapsed(false);
      setSidebarWidth(event.key === 'Home' ? 248 : sidebarWidth + (event.key === 'ArrowLeft' ? -12 : 12));
    });
    window.addEventListener('hashchange', render);
    if (!location.hash) location.hash = '#/terminal/local'; else render();
  </script>
</body>
</html>
