# Deep Current / 深海仪表台 — isolated UI preview only.
# Requires tmux with pane-scrollbars auto-hide support (the preview's next-3.8).
# Do not source from ~/.tmux.conf or apply automatically to production.
# Apply explicitly to the synthetic preview socket:
# tmux -S /tmp/tmux-panel-uiux-20261021/tmux.sock source-file docs/design/deep-current.tmux.conf
# Global window defaults below affect only the server addressed by that socket.

set-window-option -g pane-border-status top
set-window-option -g pane-border-style 'fg=colour8,bg=default'
set-window-option -g pane-active-border-style 'fg=colour4,bg=default'
set-window-option -g pane-border-format '#{?pane_active,#[fg=colour4]▸,#[fg=colour8]·}#[default] #{?pane_active,#[bold],}#{?#{@pane_label},#{@pane_label} · ,}#{pane_index}:#{pane_current_command}#[default]'

# tmux owns history inside its alternate screen; this is not xterm scrollback.
# auto-hide overlays the pane, avoiding column changes and TUI reflow.
set-window-option -g pane-scrollbars auto-hide
set-window-option -g pane-scrollbars-position right
set-window-option -g pane-scrollbars-style 'fg=colour8,bg=default,width=1,pad=0'
set-window-option -g pane-scrollbars-timeout 650

# server/tmux.js ensurePaneBorderConfig() reasserts pane-border-status and
# pane-border-format on server startup/recovery. Re-source this preview file
# afterwards when needed; this file does not change that production policy.
