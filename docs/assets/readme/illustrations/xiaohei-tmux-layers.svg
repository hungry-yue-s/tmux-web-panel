      <g>
        <text x="95" y="148" font-family="Xiaolai, Bradley Hand, Patrick Hand, Chalkboard SE, Comic Sans MS, PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, cursive, sans-serif" font-size="30" fill="#111" text-anchor="start" font-weight="500">Session = one project</text>
        <text x="103" y="188" font-family="Xiaolai, Bradley Hand, Patrick Hand, Chalkboard SE, Comic Sans MS, PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, cursive, sans-serif" font-size="20" fill="#3b82c4" text-anchor="start" font-weight="500">long-running</text>
        <text x="175" y="230" font-family="Xiaolai, Bradley Hand, Patrick Hand, Chalkboard SE, Comic Sans MS, PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, cursive, sans-serif" font-size="23" fill="#f07c24" text-anchor="start" font-weight="500">Window = tab/screen</text>
