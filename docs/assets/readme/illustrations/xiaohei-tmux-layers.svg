      <circle cx="-7" cy="-7" r="3.1" fill="#fff"/><circle cx="10" cy="-7" r="3.1" fill="#fff"/>
      <path d="M-8,28 L-12,59" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M9,28 L14,59" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
