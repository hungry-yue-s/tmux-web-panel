<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
      <title id="title">tmux session, window, and pane hierarchy</title>
      <desc id="desc">A hand-drawn workspace container illustration with Xiaohei in a bash pane</desc>
      <rect width="1200" height="675" fill="#fff"/>
      <defs>
