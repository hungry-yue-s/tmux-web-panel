        <text x="423" y="352" font-family="Xiaolai, Bradley Hand, Patrick Hand, Chalkboard SE, Comic Sans MS, PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, cursive, sans-serif" font-size="20" fill="#d94f3d" text-anchor="middle" font-weight="500">Claude Code</text>
        <text x="272" y="447" font-family="Xiaolai, Bradley Hand, Patrick Hand, Chalkboard SE, Comic Sans MS, PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, cursive, sans-serif" font-size="20" fill="#d94f3d" text-anchor="middle" font-weight="500">lazygit</text>
        <text x="750" y="374" font-family="Xiaolai, Bradley Hand, Patrick Hand, Chalkboard SE, Comic Sans MS, PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, cursive, sans-serif" font-size="22" fill="#d94f3d" text-anchor="middle" font-weight="500">bash</text>
        <text x="600" y="627" font-family="Xiaolai, Bradley Hand, Patrick Hand, Chalkboard SE, Comic Sans MS, PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, cursive, sans-serif" font-size="25" fill="#3b82c4" text-anchor="middle" font-weight="500">Codex / Claude / lazygit / bash all run in panes</text>
