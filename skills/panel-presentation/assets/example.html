<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="anymux-presentation" content="1">
  <title>主题适配示例</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--pp-page-bg, var(--pp-bg, Canvas)); color: var(--pp-fg, CanvasText); font: 16px/1.7 system-ui, sans-serif; }
    main { width: min(960px, 100%); margin: auto; padding: clamp(24px, 6vw, 64px); }
    .eyebrow, a { color: var(--pp-accent, LinkText); }
    .eyebrow { letter-spacing: .12em; font-size: 13px; }
    h1 { margin: 12px 0; font-size: clamp(32px, 5vw, 50px); line-height: 1.2; letter-spacing: -.03em; }
    .muted { color: var(--pp-muted, GrayText); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 18px; margin: 32px 0; }
    article { padding: 24px; border: 1px solid var(--pp-border, GrayText); border-radius: 16px; background: var(--pp-glass-surface, var(--pp-surface, Canvas)); }
    h2 { font-size: 18px; margin: 0 0 12px; }
    input { width: 100%; padding: 12px; color: inherit; background: var(--pp-page-bg, var(--pp-bg, Canvas)); border: 1px solid var(--pp-border, GrayText); border-radius: 8px; font: inherit; }
    input:focus-visible { outline: 2px solid var(--pp-accent, Highlight); outline-offset: 3px; }
    canvas, svg { display: block; width: 100%; height: 100px; }
    summary { cursor: pointer; padding: 12px 0; }
  </style>
</head>
<body>
<main>
  <div class="eyebrow">PANEL PRESENTATION / EXAMPLE</div>
  <h1>内容自由，配色随行。</h1>
  <p class="muted">在面板切换主题，观察同一份 HTML 的 CSS、SVG 和 Canvas 一起变化。</p>
  <div class="grid">
    <article>
      <h2>CSS 与 SVG</h2>
      <svg viewBox="0 0 300 100" role="img" aria-label="示例进度：已完成 72%">
        <rect x="0" y="30" width="300" height="22" rx="11" fill="var(--pp-surface-alt, GrayText)"/>
        <rect x="0" y="30" width="216" height="22" rx="11" fill="var(--pp-accent, Highlight)"/>
      </svg>
      <p class="muted">已完成 72% · 变量直接参与渲染</p>
    </article>
    <article>
      <h2>Canvas 图表</h2>
      <canvas width="600" height="200" role="img" aria-label="示例数据：三个阶段分别为 40、65、90"></canvas>
      <p class="muted">40 → 65 → 90 · 主题通知后重新着色</p>
    </article>
  </div>
  <label for="note">写一句笔记，再切换主题</label>
  <input id="note" placeholder="输入会保留在当前页面">
  <details><summary>展开状态也会保留</summary><p class="muted">引擎只更新颜色，不替换页面或重置交互。</p></details>
</main>
<script>
  function paint() {
    var canvas = document.querySelector('canvas');
    var ctx = canvas.getContext('2d');
    var css = getComputedStyle(document.documentElement);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = css.getPropertyValue('--pp-accent').trim() || css.color;
    [40, 65, 90].forEach(function (value, i) { ctx.fillRect(i * 200 + 20, 200 - value * 2, 140, value * 2); });
  }
  paint();
  document.addEventListener('panel-theme-change', paint);
</script>
</body>
</html>
