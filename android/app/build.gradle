import groovy.json.JsonOutput

plugins { id 'com.android.application' }

android {
    namespace 'com.tmuxpanel.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.tmuxpanel.app'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'DEFAULT_ENDPOINT', JsonOutput.toJson(providers.environmentVariable('TMUX_PANEL_URL').getOrElse(''))
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets.main.res.srcDir(layout.buildDirectory.dir('generated/panelTrust/res'))
    buildTypes { release { minifyEnabled false } }
}

def trustResources = tasks.register('generatePanelTrust') {
    def caPath = providers.environmentVariable('TMUX_PANEL_CA_CERT').getOrElse('')
    inputs.property('caPath', caPath)
    if (caPath) inputs.file(caPath)
    outputs.dir(layout.buildDirectory.dir('generated/panelTrust/res'))
    doLast {
        def out = layout.buildDirectory.dir('generated/panelTrust/res').get().asFile
        delete out
        new File(out, 'xml').mkdirs()
        def bundled = ''
        if (caPath) {
            def certificate = file(caPath).text
            if (!certificate.contains('-----BEGIN CERTIFICATE-----') || certificate.contains('PRIVATE KEY')) {
                throw new GradleException('TMUX_PANEL_CA_CERT must contain only public PEM certificates, never private keys')
            }
            new File(out, 'raw').mkdirs()
            copy { from caPath; into new File(out, 'raw'); rename { 'panel_ca.crt' } }
            bundled = '<certificates src="@raw/panel_ca"/>'
        }
        new File(out, 'xml/network_security_config.xml').text = '''<?xml version="1.0" encoding="utf-8"?>
<network-security-config>
  <base-config cleartextTrafficPermitted="true">
    <trust-anchors><certificates src="system"/><certificates src="user"/>''' + bundled + '''</trust-anchors>
  </base-config>
</network-security-config>'''
    }
}
tasks.named('preBuild').configure { dependsOn trustResources }

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    testImplementation 'junit:junit:4.13.2'
}
