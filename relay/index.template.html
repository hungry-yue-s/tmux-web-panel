<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#1a1b26">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>接续工作台 — Tmux Panel</title>
  <script>
    // Native clients seed tmux_theme before page scripts. Browsers retain the
    // last handoff preference here, independently of the panel's changing IP.
    var relayTheme = new URLSearchParams(location.search).get('theme');
    if (!relayTheme) {
      try { relayTheme = localStorage.getItem('tmux_theme') || localStorage.getItem('panel_relay_theme'); } catch (_e) {}
    }
    relayTheme = relayTheme || (matchMedia('(max-width: 760px), (pointer: coarse)').matches ? 'oyster' : 'tokyo-night');
  </script>
  <script src="theme.js"></script>
  <script>Theme.apply(relayTheme);</script>
  <style>
    * { box-sizing:border-box; }
    [hidden] { display:none!important; }
    :root { --relay-bg:var(--workspace-bg,#1a1b26); --relay-panel:var(--workspace-panel,#24283b); --relay-text:var(--workspace-text,#c0caf5); --relay-muted:var(--workspace-muted,#a9b1d6); --relay-accent:var(--workspace-accent,#7aa2f7); --relay-line:var(--workspace-line,#414868); }
    html { background:var(--relay-bg); color:var(--relay-text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; }
    body { margin:0; min-height:100vh; min-height:100dvh; }
    button,a,summary { -webkit-tap-highlight-color:transparent; }
    button { font:inherit; }
    a { color:inherit; }
    a:focus-visible,button:focus-visible,summary:focus-visible { outline:2px solid var(--relay-accent); outline-offset:5px; }
    .shell { width:min(1120px,100%); min-height:100vh; min-height:100dvh; margin:auto; padding:40px 48px 28px; display:flex; flex-direction:column; overflow:hidden; }
    .masthead { display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .brand { display:flex; align-items:center; gap:12px; font-size:18px; font-weight:650; letter-spacing:-.035em; }
    .brand svg { width:30px; height:30px; color:var(--relay-accent); }
    .theme-name { color:var(--relay-muted); font-size:12px; }
    .content { flex:1; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr); align-items:center; gap:64px; padding:72px 0; }
    h1 { margin:0 0 24px; font-size:clamp(40px,4.5vw,56px); line-height:1.22; font-weight:600; letter-spacing:-.055em; text-wrap:balance; }
    .intro { max-width:28em; margin:0; font-size:15px; line-height:1.9; color:var(--relay-muted); }
    .connection { margin-top:40px; }
    .status { display:flex; align-items:center; gap:10px; margin:0; font-size:14px; font-weight:550; min-height:24px; }
    .status-dot { width:7px; height:7px; flex:none; border-radius:50%; background:var(--relay-accent); }
    .progress { height:2px; margin-top:18px; background:var(--relay-line); overflow:hidden; border-radius:2px; }
    .progress::after { content:""; display:block; width:35%; height:100%; background:var(--relay-accent); animation:locate 1.8s ease-in-out infinite; }
    .steps { display:flex; justify-content:space-between; gap:12px; list-style:none; padding:0; margin:12px 0 0; color:var(--relay-muted); font-size:12px; }
    .steps li { display:flex; align-items:center; gap:7px; }
    .steps span { font-size:10px; border:1px solid var(--relay-line); width:18px; height:18px; display:grid; place-items:center; border-radius:50%; }
    .steps [aria-current] { color:var(--relay-accent); }
    .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:22px; }
    .button { display:inline-flex; align-items:center; justify-content:center; min-height:48px; padding:0 24px; text-decoration:none; border:1px solid var(--relay-accent); border-radius:12px; background:var(--relay-accent); color:var(--relay-bg); cursor:pointer; font-size:14px; font-weight:600; }
    .button:hover { filter:brightness(1.08); }
    .button:active { opacity:.8; }
    .visual { position:relative; min-width:0; padding:46px 0 32px; }
    .orbit { position:absolute; inset:0 -16px; border:1px solid var(--relay-line); border-radius:50%; opacity:.5; transform:rotate(-18deg); }
    .orbit::before,.orbit::after { content:""; position:absolute; width:6px; height:6px; border:1px solid var(--relay-accent); background:var(--relay-bg); border-radius:50%; }
    .orbit::before { top:12%; left:14%; } .orbit::after { bottom:12%; right:14%; }
    .workbench { position:relative; width:100%; border:1px solid var(--workspace-line-strong,var(--relay-line)); border-radius:18px; background:var(--relay-panel); box-shadow:0 24px 64px -40px var(--relay-text); overflow:hidden; transform:perspective(1000px) rotateY(-8deg) rotateX(5deg); transition:transform .6s ease; }
    .workbench-header { display:flex; align-items:center; gap:8px; height:42px; padding:0 18px; border-bottom:1px solid var(--relay-line); font-size:11px; color:var(--relay-muted); }
    .workbench-header svg { width:13px; height:13px; }
    .workbench-header span:last-child { margin-left:auto; }
    .workbench-body { display:grid; grid-template-columns:36px minmax(0,1fr) 25%; min-height:240px; }
    .rail { display:flex; align-items:center; flex-direction:column; gap:16px; padding-top:20px; border-right:1px solid var(--relay-line); }
    .rail i { width:10px; height:10px; border:1px solid var(--relay-muted); border-radius:3px; }
    .rail i:first-child { background:var(--relay-accent); border-color:var(--relay-accent); }
    .terminal { padding:24px 18px; font:12px/1.8 ui-monospace,"SFMono-Regular",Consolas,monospace; }
    .terminal p { margin:0 0 18px; color:var(--relay-muted); }
    .terminal strong { color:var(--relay-accent); font-weight:500; }
    .terminal .code-line { display:block; height:4px; margin:10px 0; width:75%; background:var(--relay-line); border-radius:3px; }
    .terminal .code-line:nth-of-type(2) { width:54%; } .terminal .code-line:nth-of-type(3) { width:65%; }
    .prompt { margin-top:26px; color:var(--relay-accent); }
    .cursor { display:inline-block; width:6px; height:12px; margin-left:5px; background:var(--relay-accent); vertical-align:-2px; }
    .files { padding:22px 12px; border-left:1px solid var(--relay-line); }
    .files i { display:block; width:75%; height:4px; margin:9px 0 17px; background:var(--relay-line); border-radius:2px; }
    .files i:nth-child(even) { width:50%; margin-left:6px; }
    .workbench-footer { display:flex; align-items:center; justify-content:space-between; padding:10px 18px; border-top:1px solid var(--relay-line); color:var(--relay-muted); font-size:10px; }
    .signal { display:flex; align-items:center; gap:10px; position:relative; width:max-content; margin:28px auto 0; padding:8px 12px; background:var(--relay-bg); font-size:11px; color:var(--relay-muted); }
    .signal-track { width:60px; height:1px; background:var(--relay-line); position:relative; }
    .signal-track::after { content:""; position:absolute; width:14px; height:3px; top:-1px; background:var(--relay-accent); border-radius:2px; animation:signal 1.8s ease-in-out infinite; }
    .bottom { display:flex; align-items:baseline; justify-content:space-between; gap:24px; border-top:1px solid var(--relay-line); padding-top:20px; color:var(--relay-muted); font-size:12px; line-height:1.7; }
    .bottom>p { margin:0; }
    details { max-width:340px; text-align:right; }
    summary { cursor:pointer; min-height:48px; display:list-item; list-style-position:inside; }
    details p { margin:0 0 12px; text-align:left; }
    details a { display:inline-flex; align-items:center; min-height:48px; font-weight:550; color:var(--relay-accent); }
    body[data-state="ready"] .progress::after { width:100%; animation:none; }
    body[data-state="ready"] .workbench { transform:none; }
    body[data-state="ready"] .signal-track::after { width:100%; animation:none; }
    body[data-state="failed"] .status-dot { background:var(--accent-red,#e49c8b); }
    body[data-state="failed"] .progress::after,body[data-state="failed"] .signal-track::after { animation:none; width:0; }
    @keyframes locate { from { transform:translateX(-100%); } to { transform:translateX(390%); } }
    @keyframes signal { from { transform:translateX(0); opacity:0; } 30%,70% { opacity:1; } to { transform:translateX(46px); opacity:0; } }
    @media(max-width:760px) {
      .shell { max-width:480px; padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left)); }
      .brand { font-size:17px; } .theme-name { font-size:11px; }
      .content { display:flex; flex-direction:column; align-items:stretch; gap:24px; padding:48px 0 32px; }
      h1 { font-size:38px; margin-bottom:16px; } .intro { font-size:14px; }
      .connection { margin-top:28px; }
      .visual { order:-1; padding:16px 12px 0; margin:0 0 10px; }
      .workbench { max-width:340px; margin:auto; border-radius:14px; }
      .workbench-header { height:32px; } .workbench-body { min-height:140px; grid-template-columns:28px minmax(0,1fr) 24%; }
      .terminal { padding:16px 12px; font-size:10px; } .terminal p { margin-bottom:12px; } .terminal .code-line { margin:8px 0; }
      .prompt { margin-top:16px; } .files { padding:14px 10px; } .workbench-footer { padding:6px 12px; font-size:9px; }
      .rail { padding-top:16px; gap:12px; } .rail i { width:8px; height:8px; }
      .signal { margin:14px auto 0; font-size:10px; } .orbit { inset:-6px -2px 0; }
      .bottom { flex-wrap:wrap; gap:4px; padding-top:16px; } details { text-align:left; } summary { min-height:48px; display:flex; align-items:center; }
    }
    @media(max-width:360px) { .shell { padding-left:20px; padding-right:20px; } .theme-name { max-width:115px; text-align:right; } h1 { font-size:34px; } }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; } .progress::after { transform:none; } .workbench { transform:none; } }
  </style>
</head>
<body data-state="resolving">
  <div class="shell">
    <header class="masthead">
      <div class="brand"><svg viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="24" height="22" rx="5"/><path d="M10 11l4 4-4 4m8 0h4"/></svg><span>Tmux Panel</span></div>
      <span class="theme-name" id="theme-name"></span>
    </header>
    <main class="content">
      <section aria-labelledby="headline">
        <h1 id="headline">回到你的<br>工作现场。</h1>
        <p class="intro">终端、文件与会话，接续如初。<br>正在为你找到工作台的当前位置。</p>
        <div class="connection">
          <p class="status" role="status" aria-live="polite"><span class="status-dot" aria-hidden="true"></span><span id="status-text">正在定位工作台…</span></p>
          <div class="progress" id="progress" role="progressbar" aria-label="正在定位工作台"></div>
          <ol class="steps" aria-label="连接步骤"><li id="step-locate" aria-current="step"><span aria-hidden="true">1</span>定位地址</li><li id="step-enter"><span aria-hidden="true">2</span>前往工作台</li></ol>
          <div class="actions"><a class="button" id="go" hidden>进入工作台</a><button class="button" id="retry" type="button" hidden>重新连接</button></div>
        </div>
      </section>
      <div class="visual" aria-hidden="true">
        <div class="orbit"></div>
        <div class="workbench">
          <div class="workbench-header"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="12" height="12" rx="2"/><path d="M6 2v12m0-6h8"/></svg><span>工作台</span><span>tmux</span></div>
          <div class="workbench-body"><div class="rail"><i></i><i></i><i></i></div><div class="terminal"><p>~/workspace</p><strong>❯ tmux attach</strong><span class="code-line"></span><span class="code-line"></span><span class="code-line"></span><div class="prompt">❯<span class="cursor"></span></div></div><div class="files"><i></i><i></i><i></i><i></i><i></i></div></div>
          <div class="workbench-footer"><span>终端 / 会话 / 文件</span><span>随时接续</span></div>
        </div>
        <div class="signal"><span>此设备</span><span class="signal-track"></span><span>你的工作台</span></div>
      </div>
    </main>
    <footer class="bottom"><p>页面关闭后，电脑上的会话仍会继续。</p><details><summary>首次连接需要帮助？</summary><p>请确认设备与电脑的网络可互通。如果浏览器提示证书不受信任，可安装这台电脑的 CA 证书，并在系统设置中启用信任。</p><a href="ca.crt" download>下载 CA 证书</a></details></footer>
    <noscript><p>请开启 JavaScript，以定位并进入工作台。</p></noscript>
  </div>
  <script>window.PANEL_RELAY_CONFIG = { name: '__DUCKDNS_FQDN__', port: __PANEL_PORT__ };</script>
  <script src="relay.js"></script>
</body>
</html>
