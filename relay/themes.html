<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>引导页主题 — Tmux Panel</title>
  <script src="theme.js"></script>
  <style>
    * { box-sizing:border-box; } body { margin:0; padding:48px max(24px,calc((100vw - 1280px)/2)); background:var(--workspace-bg); color:var(--workspace-text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    h1 { font-size:clamp(28px,4vw,40px); font-weight:600; letter-spacing:-.04em; margin:0 0 16px; } p { color:var(--workspace-muted); font-size:14px; line-height:1.8; margin:0 0 32px; max-width:50em; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px; } article { min-width:0; border:1px solid var(--workspace-line-strong); border-radius:16px; overflow:hidden; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 20px; } h2 { font-size:14px; margin:0; font-weight:550; } a { color:var(--workspace-accent); font-size:13px; min-height:48px; display:inline-flex; align-items:center; } a:focus-visible { outline:2px solid currentColor; outline-offset:4px; }
    .frame { overflow:hidden; height:410px; background:var(--workspace-panel); } iframe { display:block; width:200%; height:820px; border:0; transform:scale(.5); transform-origin:top left; pointer-events:none; }
    footer { margin-top:32px; } @media(max-width:760px) { body { padding:32px 20px; } .grid { grid-template-columns:1fr; } header { padding:8px 16px; } .frame { height:450px; } iframe { height:900px; } }
  </style>
</head>
<body>
  <h1>每一种主题，都能接续。</h1>
  <p>引导页与工作台共用完整配色。实际连接时由客户端记住的主题自动决定；移动端首次使用默认为牡蛎白。网格仅预览外观，不会连接工作台或改动偏好；点击“使用并预览”会记住该配色。</p>
  <main class="grid" id="themes"></main>
  <footer><a href="./">进入工作台</a></footer>
  <script>
    Theme.getThemeList().forEach(function (theme) {
      var card = document.createElement('article');
      var header = document.createElement('header');
      var title = document.createElement('h2'); title.textContent = theme.name;
      var link = document.createElement('a'); link.href = 'preview.html?theme=' + encodeURIComponent(theme.id); link.textContent = '使用并预览';
      header.append(title, link);
      var frame = document.createElement('div'); frame.className = 'frame';
      var iframe = document.createElement('iframe');
      // Opaque origins isolate each palette from real client preferences.
      iframe.setAttribute('sandbox', 'allow-scripts');
      iframe.src = link.href; iframe.title = theme.name + ' 引导页预览'; iframe.tabIndex = -1;
      frame.append(iframe); card.append(header, frame); document.getElementById('themes').append(card);
    });
  </script>
</body>
</html>
